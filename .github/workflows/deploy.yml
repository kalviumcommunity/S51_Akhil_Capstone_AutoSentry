name: Deploy Auto Sentry to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/Auto-Sentry/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/Auto-Sentry
          npm ci
      
      - name: Build
        run: |
          cd frontend/Auto-Sentry
          npm run build
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_FIREBASE_STORAGE_API_KEY: ${{ secrets.VITE_FIREBASE_STORAGE_API_KEY }}
          VITE_FIREBASE_STORAGE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_STORAGE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_STORAGE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_STORAGE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_STORAGE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_APP_ID: ${{ secrets.VITE_FIREBASE_STORAGE_APP_ID }}
          VITE_FIREBASE_HISTORY_API_KEY: ${{ secrets.VITE_FIREBASE_HISTORY_API_KEY }}
          VITE_FIREBASE_HISTORY_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_HISTORY_AUTH_DOMAIN }}
          VITE_FIREBASE_HISTORY_PROJECT_ID: ${{ secrets.VITE_FIREBASE_HISTORY_PROJECT_ID }}
          VITE_FIREBASE_HISTORY_BUCKET: ${{ secrets.VITE_FIREBASE_HISTORY_BUCKET }}
          VITE_FIREBASE_HISTORY_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_HISTORY_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_HISTORY_APP_ID: ${{ secrets.VITE_FIREBASE_HISTORY_APP_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/Auto-Sentry/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4